<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Digital</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HEADER CON FONDO Y TÍTULO -->
  <header class="menu-header">
    <div class="header-bar">
      <span class="logo">Mi Restaurante</span>
      <div class="header-icons">
        <span class="heart-icon"><i class="fas fa-heart"></i></span>
        <span class="menu-icon"><i class="fas fa-bars"></i></span>
      </div>
    </div>
    <div class="header-hero">
      <div class="hero-content">
        <div class="offer-text">¡Bienvenido!</div>
        <h1 class="main-title">Nuestro Menú</h1>
      </div>
    </div>
  </header>

  <!-- Categorías horizontales -->
  <nav class="menu-categories">
    <ul id="menu-categories-list"></ul>
  </nav>

  <!-- Listado de platos -->
  <section class="menu-section">
    <div class="menu-list-container">
      <div class="menu-list" id="menu-list"></div>
    </div>
  </section>

  <!-- MODAL PRODUCTO -->
  <div id="product-modal" class="product-modal">
    <div class="product-modal-content">
      <span class="modal-close"><i class="fas fa-times"></i></span>
      <img class="modal-img" src="" alt="">
      <h2 class="modal-title"></h2>
      <p class="modal-desc"></p>
      <div class="modal-price-row"></div>
      <button class="modal-heart-btn"><i class="fas fa-heart"></i> Añadir a deseos</button>
    </div>
  </div>

  <!-- SIDEBAR Y OVERLAY (opcionales, puedes eliminar si no los usas) -->
  <nav id="sidebar" class="sidebar">
    <span class="close-btn"><i class="fas fa-times"></i></span>
    <ul id="sidebar-categories"></ul>
  </nav>
  <div id="overlay" class="overlay"></div>

  <!-- SCRIPTS -->
  <script src="menu-section.js"></script>
  <script src="main.js"></script>
</body>
</html>
