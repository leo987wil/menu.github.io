<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Digital</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- FontAwesome para iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Hoja de estilos principal -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HEADER, SIDEBAR y otras secciones pueden ir aquí -->

  <!-- Barra de categorías principales -->
  <nav class="menu-categories">
    <ul id="menu-categories-list"></ul>
  </nav>

  <!-- Sección central de menú -->
  <section class="menu-section">
    <div class="menu-list-container">
      <div class="menu-list" id="menu-list"></div>
    </div>
  </section>

  <!-- SIDEBAR (opcional, descomentar si se usa) -->
  <!-- <nav id="sidebar-categories">...</nav> -->

  <!-- MODAL DE PRODUCTO: SIEMPRE al final del body, fuera de otros contenedores -->
  <div id="product-modal" class="product-modal">
    <div class="product-modal-content">
      <span class="modal-close"><i class="fas fa-times"></i></span>
      <img class="modal-img" src="" alt="">
      <h2 class="modal-title"></h2>
      <p class="modal-desc"></p>
      <div class="modal-price-row"></div>
      <button class="modal-heart-btn"><i class="fas fa-heart"></i> Añadir a deseos</button>
    </div>
  </div>

  <!-- Overlay para sidebar (opcional, si usas sidebar) -->
  <div id="overlay" class="overlay"></div>

  <!-- Scripts principales -->
  <script src="menu-section.js"></script>
  <script src="main.js"></script>
</body>
</html>
